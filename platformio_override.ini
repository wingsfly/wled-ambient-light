; 自定义构建配置。上游 .gitignore 忽略本文件，我们的 fork 已解除，
; 目的是把构建配置的改动集中在这里，对上游 platformio.ini 零侵入（设计文档 §2.1）。
; 上游的 [platformio] extra_configs 已经包含本文件，无需注册。

[env:lamp]
extends = env:esp32s3dev_16MB_opi

;; 这行当前与继承来的值相同，是有意的「钉子」—— 上游若改动那个 env 的
;; usermod 列表，我们不会被静默带走。
;; 现在**不能**把 lamp 加进来：v16.0.1 的 validate_modules.py 要求每个注册的
;; usermod 至少贡献一个编译单元。usermods/lamp/ 目前只有纯头文件，
;; 链接产物里找不到符号，会报
;;   ERROR: No symbols from ['lamp'] found in linked output!
;; 等阶段 2 的 AudioSource 落地第一个 .cpp，再改成 `audioreactive lamp`。
;; 另注：v16.0.1 上游写死的就是 `audioreactive`，没有 ${common.default_usermods}
;; 这个变量，引用它会直接构建失败。
custom_usermods = audioreactive

;; ---- 烧录与 flash 模式：首板实测锁定（reviews/carrier/2026-08-23 BRINGUP §6）----
;; 继承来的 qio_opi + 921600 在实物上翻车：QIO 启动进看门狗复位循环，
;; CH340 在 921600 下连接不稳。实测 DIO/80MHz 可稳定启动、115200 可完成
;; 上传。以前只靠操作者记住命令行覆盖参数 —— 现在钉死在 env 里。
;; ⚠️ **DIO 不用锁 —— `pio run -t upload` 的烧录路径天然就是 DIO。**
;; 这是排查三条死路后 dump 真实命令（pio run -v -t upload）看出来的：
;;   ① memory_type=dio_opi → sdkconfig.h 找不到（预编译 SDK 只有
;;      opi_opi/opi_qspi/qio_opi/qio_qspi）；
;;   ② board_build.flash_mode=dio → bootloader_dio_80m.elf 不存在
;;      （预编译 bootloader 只有 opi/qio 两族）；
;;   ③ upload_flags=--flash_mode dio → 被当成一个带引号的整体 token
;;      插到 write_flash 子命令**之前**，esptool 直接 argparse 报错。
;; 而 ③ 的报错输出里已经躺着答案：tasmota 版 espressif32 平台的
;; __get_board_flash_mode 对 qio 板生成的 esptool 参数**本来就是**
;; `write_flash --flash_mode dio`（esptool 会据此 patch bootloader 镜像
;; 头，ROM 就按 DIO 启动）。所以 BRINGUP §6 那次「QIO 看门狗复位」
;; 只可能来自**绕过 pio 的烧录路径**（裸 esptool 不带 --flash_mode 时
;; 默认 keep=QIO 头）。规矩因此是：**烧录一律走 `pio run -e lamp -t
;; upload`**，别拿裸 esptool 直写 —— 要手写就必须带 --flash_mode dio。
board_build.f_flash = 80000000L
upload_speed = 115200

;; 换掉继承来的 release name。不换的话本 env 产出的固件与上游通用板同名，
;; 写进同一个 build_output/release/ 路径，/json/info 也自报为通用板。
;; 必须先 unflag：output_bins.py 取 define 列表第 0 项，直接追加第二个 -D
;; 不生效，还会触发 macro redefined 警告。
;; ⚠️ 这里硬编码了上游的字符串，上游若重命名该 env，本行会**静默失效**。
build_unflags =
  ${env:esp32s3dev_16MB_opi.build_unflags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_16MB_opi\"

build_flags =
  ${env:esp32s3dev_16MB_opi.build_flags}
  -D WLED_RELEASE_NAME=\"AmbientLamp_S3\"
  ;; ---- 灯管输出：两路各 48 颗（实测）----
  -D DATA_PINS=16,17
  -D PIXEL_COUNTS=48,48
  ;; ---- I2S 数字麦（INMP441 / ICS-43434），SR_DMTYPE=1 表示通用 I2S ----
  -D SR_DMTYPE=1
  -D I2S_CKPIN=5
  -D I2S_WSPIN=6
  -D I2S_SDPIN=7

[env:native]
;; 主机端单元测试（设计文档 §7.1 第一层）：纯逻辑模块在 Mac 上编译运行。
;;
;; 下面三行清空是**必须的**，不是冗余 —— 上游 platformio.ini 有一个裸 [env]
;; 段落，其设置会落到每一个 env 上，包括本 env：
;;   framework=      不清 → "Please specify `board` … to use with 'arduino' framework"
;;   lib_deps=       不清 → NeoPixelBus 等被编译，死在 fatal error: 'Arduino.h' not found
;;   extra_scripts=  不清 → build_ui.py 每次跑 npm；validate_modules.py 追加
;;                          -Wl,--Map=… 导致 ld: unknown options
platform = native
framework =
lib_deps =
extra_scripts =
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I usermods/lamp
  -I tools
;; ⚠️ PlatformIO 会把 -Iwled00 排在 -Iusermods/lamp **前面**，所以
;; usermods/lamp/ 下的头文件不要与 wled00/ 下的同名（colors.h、const.h、prng.h 等），
;; 否则会被上游同名文件遮蔽。
;;
;; 多线程的环形缓冲测试只在 env:native_tsan 下有意义，这里必须排除。
;; 不带 TSan 跑它就是一次纯结果导向的并发压测 —— 而那种压测对内存序**没有
;; 判别力**：arm64 上 2000 万样本 × 3 轮，memory_order 全改 relaxed 的版本
;; 业务断言同样 0 错（TSan 下同一次运行报出 race，业务断言依旧 PASS）。
;; 留在 env:native 里只会制造虚假安全感。
test_ignore = test_lamp_ring_buffer_tsan

[env:native_tsan]
;; 主机端单元测试 + ThreadSanitizer。存在的唯一理由是 lamp_ring_buffer.h 的
;; acquire/release：单线程测试原理上抓不到内存序错误（6 行共 8 处 memory_order
;; 全改成 relaxed，test_lamp_ring_buffer 的 7 个用例照样全过），只有 TSan 的
;; happens-before 分析能确定性地报出来。
;;
;; ⚠️ 光有这个 env 没用 —— TSan 只在真有并发访问时才报 race。
;; 判别力来自 test_lamp_ring_buffer_tsan 那个真起线程的测试，两者缺一不可。
extends = env:native

;; 清空继承来的 test_ignore，否则本 env 恰好跑不到那个唯一需要它的测试。
;; 顺带把其余 4 个测试也带上：全套只多几秒，且以后任何模块长出线程都自动进网。
test_ignore =

build_flags =
  ${env:native.build_flags}
  ;; SCons 4.8.1 的 ParseFlags 对 -fsanitize* 特殊处理，会同时进 CCFLAGS 和
  ;; LINKFLAGS（Environment.py:1003）—— 所以编译和链接都带上了，不必额外补链接标志。
  -fsanitize=thread
  ;; -g / -fno-omit-frame-pointer：让 TSan 的报告带上文件名行号，否则只有地址。
  -g
  -fno-omit-frame-pointer
  ;; TSan 官方建议的优化档位：-O0 太慢，-O2 会把栈帧优化掉。
  -O1
  ;; RingBuffer 的方法是模板头文件里的小函数，-O1 会把它们内联进调用点，
  ;; 于是 TSan 报告的栈顶变成测试文件的行号，看不出问题出在 lamp_ring_buffer.h。
  ;; 关掉内联，报告才直接指向 buf_ 的那两行。
  -fno-inline
