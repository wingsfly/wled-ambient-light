; 自定义构建配置。上游 .gitignore 忽略本文件，我们的 fork 已解除，
; 目的是把构建配置的改动集中在这里，对上游 platformio.ini 零侵入（设计文档 §2.1）。
; 上游的 [platformio] extra_configs 已经包含本文件，无需注册。

[env:lamp]
extends = env:esp32s3dev_16MB_opi

;; 这行当前与继承来的值相同，是有意的「钉子」—— 上游若改动那个 env 的
;; usermod 列表，我们不会被静默带走。
;; 现在**不能**把 lamp 加进来：v16.0.1 的 validate_modules.py 要求每个注册的
;; usermod 至少贡献一个编译单元。usermods/lamp/ 目前尚未建立，而在它建立之后的
;; 阶段 0-1 里也只有纯头文件，链接产物里找不到符号，会报
;;   ERROR: No symbols from ['lamp'] found in linked output!
;; 等阶段 2 的 AudioSource 落地第一个 .cpp，再改成 `audioreactive lamp`。
;; 另注：v16.0.1 上游写死的就是 `audioreactive`，没有 ${common.default_usermods}
;; 这个变量，引用它会直接构建失败。
custom_usermods = audioreactive

;; 换掉继承来的 release name。不换的话本 env 产出的固件与上游通用板同名，
;; 写进同一个 build_output/release/ 路径，/json/info 也自报为通用板。
;; 必须先 unflag：output_bins.py 取 define 列表第 0 项，直接追加第二个 -D
;; 不生效，还会触发 macro redefined 警告。
;; ⚠️ 这里硬编码了上游的字符串，上游若重命名该 env，本行会**静默失效**。
build_unflags =
  ${env:esp32s3dev_16MB_opi.build_unflags}
  -D WLED_RELEASE_NAME=\"ESP32-S3_16MB_opi\"

build_flags =
  ${env:esp32s3dev_16MB_opi.build_flags}
  -D WLED_RELEASE_NAME=\"AmbientLamp_S3\"
  ;; ---- 灯管输出：两路各 48 颗（实测）----
  -D DATA_PINS=16,17
  -D PIXEL_COUNTS=48,48
  ;; ---- I2S 数字麦（INMP441 / ICS-43434），SR_DMTYPE=1 表示通用 I2S ----
  -D SR_DMTYPE=1
  -D I2S_CKPIN=5
  -D I2S_WSPIN=6
  -D I2S_SDPIN=7

[env:native]
;; 主机端单元测试（设计文档 §7.1 第一层）：纯逻辑模块在 Mac 上编译运行。
;;
;; 下面三行清空是**必须的**，不是冗余 —— 上游 platformio.ini 有一个裸 [env]
;; 段落，其设置会落到每一个 env 上，包括本 env：
;;   framework=      不清 → "Please specify `board` … to use with 'arduino' framework"
;;   lib_deps=       不清 → NeoPixelBus 等被编译，死在 fatal error: 'Arduino.h' not found
;;   extra_scripts=  不清 → build_ui.py 每次跑 npm；validate_modules.py 追加
;;                          -Wl,--Map=… 导致 ld: unknown options
platform = native
framework =
lib_deps =
extra_scripts =
test_framework = unity
test_build_src = no
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -I usermods/lamp
;; ⚠️ PlatformIO 会把 -Iwled00 排在 -Iusermods/lamp **前面**，所以
;; usermods/lamp/ 下的头文件不要与 wled00/ 下的同名（colors.h、const.h、prng.h 等），
;; 否则会被上游同名文件遮蔽。
